version: 2

# The `directory` of each ecosystem must point at the folder that holds its
# manifest. The Python and Rust entries used to point at /sidecar and
# /src-tauri (an old layout), so Dependabot silently never updated either.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # pdfjs-dist 6.4+ needs newer JS features (Map.getOrInsertComputed) than
      # our Node 22 test environment and older browsers provide; hold at 6.3.x
      # until that's a deliberate upgrade.
      - dependency-name: pdfjs-dist
        versions: [">= 6.4.0"]
    groups:
      # One PR for the routine patch churn, individual PRs for anything larger.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /apps/desktop/sidecar
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: [minor, patch]
