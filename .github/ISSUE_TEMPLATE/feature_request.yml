name: Feature or tool request
description: Suggest a new tool or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome, with one hard rule: **files must never leave the
        user's machine**, so a feature that needs an upload or a remote service
        can't be built. Check the README's tool list first in case it already exists.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the job, not just the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where should it live?
      options:
        - Desktop app
        - Web app
        - Both
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you use today?
      description: Other tools or workarounds, and what they do badly.
