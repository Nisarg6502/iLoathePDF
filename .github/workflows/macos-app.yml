name: macOS app

# Builds the Mac app on pull requests that touch it, and proves the bundle
# works (scripts/check-macos-bundle.sh): the engine and Ghostscript run from
# inside the .app, the app starts and starts its engine, and a screenshot of
# the window is kept as an artifact for a person to look at. Releases build
# the same way in release-desktop.yml.

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "package-lock.json"
      - ".github/workflows/macos-app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and check (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/desktop/sidecar/requirements.txt

      - name: Install npm dependencies
        working-directory: .
        run: npm ci

      - name: Rust lint (macOS-only code)
        run: |
          mkdir -p vendor build/sidecar/iloathepdf-sidecar
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build the app
        run: bash scripts/build-macos.sh

      - name: Check the bundle
        run: bash scripts/check-macos-bundle.sh src-tauri/target/release/bundle/macos/iLoathePDF.app "$RUNNER_TEMP/iloathepdf-macos.png"

      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-screenshot
          path: ${{ runner.temp }}/iloathepdf-macos*.png
          if-no-files-found: warn

      - name: Keep the disk image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-dmg
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 7
