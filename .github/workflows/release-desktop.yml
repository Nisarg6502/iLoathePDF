name: Release desktop

# Push a tag like `v0.12.0` to build the Windows installer and the two macOS
# disk images (Apple Silicon and Intel) in parallel, then publish them all in
# one GitHub release with a single update manifest (latest.json).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    # The "release" environment only deploys from `main` and `v*.*.*` tags, so a
    # feature branch can never run this workflow with the signing key.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/desktop/sidecar/requirements.txt

      - name: Install npm dependencies
        run: npm ci

      - name: Create venv and install sidecar dependencies
        working-directory: apps/desktop
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -r sidecar/requirements.txt

      - name: Download Ghostscript installer
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $url = "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10071/gs10071w64.exe"
          $expectedHash = "3A4C28D0AAC47AA7CCCD35A5932C55110376E9DBD966898DDE388B7FABA444A4"
          Invoke-WebRequest -Uri $url -OutFile gs-installer.exe
          $actualHash = (Get-FileHash gs-installer.exe -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "Ghostscript installer hash mismatch. Expected $expectedHash, got $actualHash"
          }

      - name: Install Ghostscript into vendor/
        working-directory: apps/desktop
        shell: pwsh
        timeout-minutes: 3
        run: |
          # The NSIS installer's /S silent flag does not reliably suppress every
          # prompt on a headless CI runner (a run on 2026-09-04 hung for 2+ hours
          # with -Wait never returning, no error, no output). 7-Zip can extract
          # an NSIS installer's payload directly, like any other archive, which
          # sidesteps installer UI logic entirely rather than trying to silence it.
          $vendorPath = Join-Path (Get-Location) "vendor\ghostscript"
          & "C:\Program Files\7-Zip\7z.exe" x ".\gs-installer.exe" "-o$vendorPath" -y
          if ($LASTEXITCODE -ne 0) { throw "7z extraction of the Ghostscript installer failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $vendorPath "bin"))) {
            throw "Ghostscript did not extract to the expected path: $vendorPath"
          }
          Remove-Item gs-installer.exe

      - name: Trim Ghostscript and bundle its runtime
        working-directory: apps/desktop
        shell: pwsh
        # Drops ~50 MB the app never uses (manuals, examples, an unrun VC++
        # installer), copies the MSVC runtime DLLs next to gsdll64.dll, and
        # smoke-tests the result. See the script header.
        run: ./scripts/prune-ghostscript.ps1

      - name: Check version consistency
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -eq "tag") {
            npm run check:version --workspace=apps/desktop -- $env:REF_NAME
          } else {
            npm run check:version --workspace=apps/desktop
          }
          if ($LASTEXITCODE -ne 0) { throw "Version check failed" }

      - name: Build frontend
        run: npm run build --workspace=apps/desktop

      - name: Build installer
        run: npm run build:app --workspace=apps/desktop
        env:
          # Signs the installer so installed copies of the app can verify an
          # update before running it. The matching public key is in
          # apps/desktop/src-tauri/tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer found in apps/desktop/src-tauri/target/release/bundle/nsis" }
          if (-not (Test-Path "$($installer.FullName).sig")) { throw "No signature next to $($installer.Name) - is TAURI_SIGNING_PRIVATE_KEY set?" }
          echo "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      # The website's Download button links to
      # releases/latest/download/iLoathePDF-setup.exe, which only works with a
      # name that doesn't change between versions. (The site can't ask the
      # GitHub API for the versioned name: its CSP allows no connections to
      # other servers.) The versioned file stays for the updater (latest.json).
      - name: Copy installer under a fixed name
        id: stable
        shell: pwsh
        run: |
          $copy = Join-Path (Split-Path "${{ steps.installer.outputs.path }}") "iLoathePDF-setup.exe"
          Copy-Item "${{ steps.installer.outputs.path }}" $copy
          echo "path=$copy" >> $env:GITHUB_OUTPUT

      - name: Keep the Windows files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: |
            ${{ steps.installer.outputs.path }}
            ${{ steps.installer.outputs.path }}.sig
            ${{ steps.stable.outputs.path }}
          if-no-files-found: error

  # Free builds with no Apple Developer account: signed ad hoc, not notarised
  # (see apps/desktop/scripts/build-macos.sh). One per architecture, because
  # the Python engine's libraries are built per architecture.
  macos:
    name: macOS app (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            name: Apple Silicon
            arch: aarch64
            dmg: iLoathePDF-mac-apple-silicon.dmg
          - runner: macos-15-intel
            name: Intel
            arch: x86_64
            dmg: iLoathePDF-mac-intel.dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    environment: release
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/desktop/sidecar/requirements.txt

      - name: Install npm dependencies
        working-directory: .
        run: npm ci

      - name: Check version consistency
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            npm run check:version -- "$REF_NAME"
          else
            npm run check:version
          fi

      - name: Build the app
        run: bash scripts/build-macos.sh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Check the bundle
        run: bash scripts/check-macos-bundle.sh src-tauri/target/release/bundle/macos/iLoathePDF.app "$RUNNER_TEMP/screenshot.png"

      # The website links to releases/latest/download/<fixed name>.dmg, like
      # the Windows installer. The update archive gets the version and the
      # architecture in its name, so the two Mac builds don't collide.
      - name: Name the files
        id: files
        env:
          DMG: ${{ matrix.dmg }}
          ARCH: ${{ matrix.arch }}
        run: |
          bundle=src-tauri/target/release/bundle
          version=$(node -p "require('./package.json').version")
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          cp "$(ls "$bundle"/dmg/*.dmg | head -1)" "$out/$DMG"
          archive="iLoathePDF_${version}_${ARCH}.app.tar.gz"
          cp "$bundle/macos/iLoathePDF.app.tar.gz" "$out/$archive"
          cp "$bundle/macos/iLoathePDF.app.tar.gz.sig" "$out/$archive.sig"
          ls -lh "$out"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - name: Keep the macOS files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}
          path: ${{ steps.files.outputs.dir }}/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: apps/desktop/scripts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Determine release tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-$RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      # One manifest for every platform. Installed copies read it from
      # releases/latest/download/latest.json (tauri.conf.json).
      - name: Write update manifest (latest.json)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          python3 apps/desktop/scripts/write-update-manifest.py dist "$TAG" "$REPO" > latest.json
          cat latest.json
          ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: iLoathePDF ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*
            latest.json
