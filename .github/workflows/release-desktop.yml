name: Release desktop

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build installer and publish release
    runs-on: windows-latest
    timeout-minutes: 30
    # The "release" environment only deploys from `main` and `v*.*.*` tags, so a
    # feature branch can never run this workflow with the signing key.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/desktop/sidecar/requirements.txt

      - name: Install npm dependencies
        run: npm ci

      - name: Create venv and install sidecar dependencies
        working-directory: apps/desktop
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -r sidecar/requirements.txt

      - name: Download Ghostscript installer
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $url = "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10071/gs10071w64.exe"
          $expectedHash = "3A4C28D0AAC47AA7CCCD35A5932C55110376E9DBD966898DDE388B7FABA444A4"
          Invoke-WebRequest -Uri $url -OutFile gs-installer.exe
          $actualHash = (Get-FileHash gs-installer.exe -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "Ghostscript installer hash mismatch. Expected $expectedHash, got $actualHash"
          }

      - name: Install Ghostscript into vendor/
        working-directory: apps/desktop
        shell: pwsh
        timeout-minutes: 3
        run: |
          # The NSIS installer's /S silent flag does not reliably suppress every
          # prompt on a headless CI runner (a run on 2026-09-04 hung for 2+ hours
          # with -Wait never returning, no error, no output). 7-Zip can extract
          # an NSIS installer's payload directly, like any other archive, which
          # sidesteps installer UI logic entirely rather than trying to silence it.
          $vendorPath = Join-Path (Get-Location) "vendor\ghostscript"
          & "C:\Program Files\7-Zip\7z.exe" x ".\gs-installer.exe" "-o$vendorPath" -y
          if ($LASTEXITCODE -ne 0) { throw "7z extraction of the Ghostscript installer failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $vendorPath "bin"))) {
            throw "Ghostscript did not extract to the expected path: $vendorPath"
          }
          Remove-Item gs-installer.exe

      - name: Check version consistency
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -eq "tag") {
            npm run check:version --workspace=apps/desktop -- $env:REF_NAME
          } else {
            npm run check:version --workspace=apps/desktop
          }
          if ($LASTEXITCODE -ne 0) { throw "Version check failed" }

      - name: Build frontend
        run: npm run build --workspace=apps/desktop

      - name: Build installer
        run: npm run build:app --workspace=apps/desktop
        env:
          # Signs the installer so installed copies of the app can verify an
          # update before running it. The matching public key is in
          # apps/desktop/src-tauri/tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer found in apps/desktop/src-tauri/target/release/bundle/nsis" }
          echo "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      - name: Determine release tag
        id: tag
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:REF_TYPE -eq "tag") {
            echo "tag=$env:REF_NAME" >> $env:GITHUB_OUTPUT
            echo "prerelease=false" >> $env:GITHUB_OUTPUT
          } else {
            echo "tag=dev-$env:RUN_NUMBER" >> $env:GITHUB_OUTPUT
            echo "prerelease=true" >> $env:GITHUB_OUTPUT
          }

      - name: Write update manifest (latest.json)
        shell: pwsh
        run: |
          $installer = Get-Item "${{ steps.installer.outputs.path }}"
          $sigFile = "$($installer.FullName).sig"
          if (-not (Test-Path $sigFile)) { throw "No signature file at $sigFile - is TAURI_SIGNING_PRIVATE_KEY set?" }
          $version = "${{ steps.tag.outputs.tag }}".TrimStart("v")
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/$($installer.Name)"
          $manifest = [ordered]@{
            version  = $version
            notes    = "See https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.tag }}"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sigFile -Raw).Trim()
                url       = $url
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path latest.json -Encoding utf8
          Get-Content latest.json

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: iLoathePDF ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
          files: |
            ${{ steps.installer.outputs.path }}
            latest.json
