name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint --workspace=apps/desktop
      - name: Typecheck
        run: npm run typecheck --workspace=apps/desktop
      - name: Build
        run: npm run build --workspace=apps/desktop

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Tesseract (source of eng.traineddata)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr-eng
      - name: Vendor tesseract.js local assets
        run: |
          set -e
          mkdir -p apps/web/public/tesseract/core apps/web/public/tesseract/lang
          cp node_modules/tesseract.js/dist/worker.min.js apps/web/public/tesseract/
          cp node_modules/tesseract.js-core/tesseract-core-simd-lstm.{js,wasm,wasm.js} node_modules/tesseract.js-core/tesseract-core-relaxedsimd-lstm.{js,wasm,wasm.js} node_modules/tesseract.js-core/tesseract-core-lstm.{js,wasm,wasm.js} apps/web/public/tesseract/core/
          eng_traineddata=$(find /usr/share/tesseract-ocr -name eng.traineddata | head -1)
          gzip -k -c "$eng_traineddata" > apps/web/public/tesseract/lang/eng.traineddata.gz
      - name: Typecheck
        run: npm run typecheck --workspace=apps/web
      - name: Test
        run: npm run test --workspace=apps/web
      - name: Build
        run: npm run build --workspace=apps/web

  engine:
    name: Document engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Ghostscript
        run: sudo apt-get update && sudo apt-get install -y ghostscript
      - name: Install Tesseract
        run: sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: pip install -r sidecar/requirements.txt
      - name: Test
        run: python -m pytest

  rust:
    name: Rust
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Placeholder resource paths
        run: |
          New-Item -ItemType Directory -Force vendor
          New-Item -ItemType Directory -Force build/sidecar/iloathepdf-sidecar
        shell: pwsh

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
