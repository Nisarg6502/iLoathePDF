name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  engine:
    name: Document engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Ghostscript is what compression and rasterising actually run on, so the
      # tests covering them run here rather than skipping.
      - name: Install Ghostscript
        run: sudo apt-get update && sudo apt-get install -y ghostscript
      - run: pip install -r sidecar/requirements.txt
      - name: Test
        run: python -m pytest

  rust:
    name: Rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri_build validates every bundle.resources path at build-script time.
      # Both of ours are gitignored -- vendor/ holds the AGPL Ghostscript build
      # and build/ holds the frozen engine -- so a clean checkout has neither
      # and the build script fails before clippy ever runs. Lint does not need
      # their contents, only the paths.
      - name: Placeholder resource paths
        run: |
          New-Item -ItemType Directory -Force vendor
          New-Item -ItemType Directory -Force build/sidecar/iloathepdf-sidecar
        shell: pwsh

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
