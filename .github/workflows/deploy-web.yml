name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Tesseract (source of eng.traineddata)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr-eng
      - name: Vendor tesseract.js local assets
        run: |
          set -e
          mkdir -p apps/web/public/tesseract/core apps/web/public/tesseract/lang
          cp node_modules/tesseract.js/dist/worker.min.js apps/web/public/tesseract/
          cp node_modules/tesseract.js-core/tesseract-core-simd-lstm.{js,wasm,wasm.js} node_modules/tesseract.js-core/tesseract-core-relaxedsimd-lstm.{js,wasm,wasm.js} node_modules/tesseract.js-core/tesseract-core-lstm.{js,wasm,wasm.js} apps/web/public/tesseract/core/
          eng_traineddata=$(find /usr/share/tesseract-ocr -name eng.traineddata | head -1)
          gzip -k -c "$eng_traineddata" > apps/web/public/tesseract/lang/eng.traineddata.gz
      - name: Typecheck
        run: npm run typecheck --workspace=apps/web
      - name: Test
        run: npm run test --workspace=apps/web
      - name: Build
        run: npm run build --workspace=apps/web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
