[package]
name = "iloathepdf"
version = "0.13.0"
description = "Offline PDF and image toolkit"
authors = ["Nisarg6502"]
license = "MIT"
repository = "https://github.com/Nisarg6502/iLoathePDF"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "iloathepdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Explorer starts the app once per selected file ("Send to", the right-click
# menu); this hands those launches to the window that is already open.
tauri-plugin-single-instance = "2"
# Default features minus `zip`: that feature only unpacks .zip update bundles,
# and releases ship a plain signed setup .exe. Leaving it out drops the zip,
# tar and flate2 crates (and the zip 4.x advisories RUSTSEC-2026-0545/0548).
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
# The update download is done here (resumable, with real error messages) rather
# than by the updater plugin; same feature set as the plugin so nothing extra is built.
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider", "system-proxy"] }
futures-util = "0.3"
minisign-verify = "0.2"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# The startup gate in src/instance_gate.rs. Same version and features the
# single-instance plugin already builds, so nothing new is compiled.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

# Smaller app binary with the same speed: whole-program optimisation (lto,
# one codegen unit) lets the compiler drop unused code across crates, and
# strip leaves debug symbols out of the shipped exe. opt-level stays at the
# default 3, and panics still unwind, so runtime behaviour is unchanged.
[profile.release]
lto = true
codegen-units = 1
strip = true
