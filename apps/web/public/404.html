<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>iLoathePDF</title>
    <!--
      GitHub Pages has no server-side routing, so any deep link (e.g. /tools/merge)
      that isn't a real file 404s here. This is the well-known SPA fallback trick
      (https://github.com/rafgraph/spa-github-pages): encode the intended path into
      a query string and redirect to the real index.html, which restores it via
      history.replaceState before React Router reads the URL (see apps/web/index.html).
    -->
    <script>
      var pathSegmentsToKeep = 1; // keep "/iLoathePDF" (the GitHub Pages base path)
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
