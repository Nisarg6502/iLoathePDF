<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>iLoathePDF</title>
    <meta name="robots" content="noindex" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; base-uri 'none'; form-action 'none'" />
    <!--
      GitHub Pages has no server-side routing, so any deep link (e.g. /tools/merge)
      that isn't a prerendered page (a saved recipe, a mistyped URL) lands here. This is the well-known SPA fallback trick
      (https://github.com/rafgraph/spa-github-pages): encode the intended path into
      a query string and redirect to the real index.html, which restores it via
      history.replaceState before React Router reads the URL (see apps/web/index.html).
    -->
    <script src="/spa-404.js"></script>
  </head>
  <body></body>
</html>
