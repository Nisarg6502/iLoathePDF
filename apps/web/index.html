<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iLoathePDF — PDF tools that never upload your files</title>
    <meta name="description" content="Merge, split, compress, organize and convert PDFs and images, entirely in your browser tab. No upload, no server, no account." />
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="canonical" href="https://iloathepdf.com/" />
    <link rel="preload" href="/fonts/general-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/general-sans-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <!-- Link previews (WhatsApp, Slack, iMessage, X, LinkedIn, ...). Crawlers need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="iLoathePDF" />
    <meta property="og:url" content="https://iloathepdf.com/" />
    <meta property="og:title" content="iLoathePDF — PDF tools that never upload your files" />
    <meta property="og:description" content="Merge, split, compress, organize and convert PDFs and images, entirely in your browser tab. No upload, no server, no account." />
    <meta property="og:image" content="https://iloathepdf.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="iLoathePDF: Your files never leave this tab." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="iLoathePDF — PDF tools that never upload your files" />
    <meta name="twitter:description" content="Merge, split, compress, organize and convert PDFs and images, entirely in your browser tab. No upload, no server, no account." />
    <meta name="twitter:image" content="https://iloathepdf.com/og-image.png" />
    <meta name="theme-color" content="#e0a83c" />
    <!--
      Counterpart to public/404.html's SPA redirect: restores the real path from
      the "?/actualpath" query string before React Router reads the URL. A file,
      not an inline script, so the Content Security Policy can forbid inline code.
    -->
    <script src="/spa-restore.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
